<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" role="img" aria-label="finmemory — mapa de preços ao vivo">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2ecc49" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#2ecc49" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="titleg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#2ecc49" />
    </linearGradient>
    <clipPath id="mclip"><rect x="12" y="12" width="1076" height="262" rx="12" /></clipPath>
    <!-- pin: teardrop, tip em (0,0), topo em y-36 -->
    <path id="pin" d="M 0 0 C -10 -10 -16 -18 -16 -26 A 16 16 0 1 1 16 -26 C 16 -18 10 -10 0 0 Z" />
  </defs>

  <rect width="1100" height="320" fill="#0b1220" />

  <!-- ============ o mapa É o banner ============ -->
  <g clip-path="url(#mclip)">
    <!-- quadras / blocos -->
    <g fill="#0f1a2e">
      <rect x="60" y="40" width="150" height="70" rx="4" transform="rotate(-3 135 75)" />
      <rect x="250" y="30" width="120" height="86" rx="4" transform="rotate(2 310 73)" />
      <rect x="70" y="150" width="180" height="90" rx="4" transform="rotate(1.5 160 195)" />
      <rect x="300" y="160" width="140" height="100" rx="4" transform="rotate(-2 370 210)" />
      <rect x="500" y="40" width="160" height="74" rx="4" transform="rotate(2.5 580 77)" />
      <rect x="700" y="46" width="150" height="66" rx="4" transform="rotate(-2 775 79)" />
      <rect x="490" y="200" width="130" height="66" rx="4" transform="rotate(1 555 233)" />
      <rect x="880" y="40" width="150" height="80" rx="4" transform="rotate(-1.5 955 80)" />
      <rect x="840" y="160" width="190" height="90" rx="4" transform="rotate(2 935 205)" />
      <rect x="640" y="130" width="120" height="60" rx="4" transform="rotate(-2.5 700 160)" />
    </g>

    <!-- ruas: traçado irregular -->
    <g fill="none" stroke-linecap="round">
      <!-- arteriais -->
      <path d="M 12 132 L 260 118 L 470 138 L 700 122 L 900 140 L 1088 128" stroke="#22345a" stroke-width="9" />
      <path d="M 120 274 L 340 262 L 560 272 L 800 258 L 1088 268" stroke="#22345a" stroke-width="9" />
      <path d="M 462 12 L 470 120 L 452 274" stroke="#22345a" stroke-width="8" />
      <!-- secundárias -->
      <path d="M 232 12 L 226 274" stroke="#182642" stroke-width="5" />
      <path d="M 12 58 L 200 66 L 452 52" stroke="#182642" stroke-width="5" />
      <path d="M 640 12 L 654 132 L 640 274" stroke="#182642" stroke-width="5" />
      <path d="M 830 12 L 822 140 L 846 274" stroke="#182642" stroke-width="5" />
      <path d="M 470 210 L 640 200 L 830 214 L 1088 204" stroke="#182642" stroke-width="5" />
      <path d="M 452 92 C 560 80, 660 96, 830 84 L 1088 96" stroke="#182642" stroke-width="4" />
      <path d="M 1010 12 L 1000 274" stroke="#182642" stroke-width="4" />
    </g>
    <!-- traços de rua (dash miolo) -->
    <g fill="none" stroke="#3a5f9e" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="8 10">
      <path d="M 12 132 L 260 118 L 470 138 L 700 122 L 900 140 L 1088 128" />
      <path d="M 120 274 L 340 262 L 560 272 L 800 258 L 1088 268" />
    </g>

    <!-- parque -->
    <rect x="96" y="180" width="120" height="70" rx="8" fill="#12331f" opacity="0.8" transform="rotate(-4 156 215)" />

    <!-- ============ radar: o agente varrendo a cidade ============ -->
    <g>
      <circle cx="735" cy="200" r="118" fill="none" stroke="#2ecc49" stroke-width="1" stroke-dasharray="3 8" stroke-opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="0 735 200" to="360 735 200" dur="40s" repeatCount="indefinite" />
      </circle>
      <circle cx="735" cy="200" r="78" fill="none" stroke="#2ecc49" stroke-width="1" stroke-dasharray="4 7" stroke-opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="360 735 200" to="0 735 200" dur="26s" repeatCount="indefinite" />
      </circle>
      <circle cx="735" cy="200" r="40" fill="none" stroke="#2ecc49" stroke-width="0.8" stroke-opacity="0.3" />
      <!-- cone -->
      <path d="M 735 200 L 735 82 A 118 118 0 0 1 818 117 Z" fill="url(#sweep)">
        <animateTransform attributeName="transform" type="rotate" from="0 735 200" to="360 735 200" dur="7s" repeatCount="indefinite" />
      </path>
      <circle cx="735" cy="200" r="6" fill="#2ecc49" filter="url(#soft)">
        <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <text x="735" y="222" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#8ff0a4">agente</text>
    </g>

    <!-- ============ pins de preço ============ -->
    <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="15" font-weight="bold">
      <!-- p1 esmeralda -->
      <g transform="translate(180 232)">
        <use href="#pin" fill="#2ecc49" stroke="#0b1220" stroke-width="2" filter="url(#soft)" />
        <circle cy="-26" r="5" fill="#0b1220" />
        <rect x="-42" y="-66" width="84" height="26" rx="6" fill="#0f1a2e" stroke="#2ecc49" stroke-width="1.4" />
        <text y="-48" text-anchor="middle" fill="#2ecc49">R$ 4,99</text>
      </g>
      <!-- p2 cyan -->
      <g transform="translate(430 212)">
        <use href="#pin" fill="#00c2d8" stroke="#0b1220" stroke-width="2" filter="url(#soft)" />
        <circle cy="-26" r="5" fill="#0b1220" />
        <rect x="-42" y="-66" width="84" height="26" rx="6" fill="#0f1a2e" stroke="#00c2d8" stroke-width="1.4" />
        <text y="-48" text-anchor="middle" fill="#35d6e8">R$ 8,49</text>
      </g>
      <!-- p3 âmbar -->
      <g transform="translate(566 246)">
        <use href="#pin" fill="#f5b83d" stroke="#0b1220" stroke-width="2" filter="url(#soft)" />
        <circle cy="-26" r="5" fill="#0b1220" />
        <rect x="-45" y="-66" width="90" height="26" rx="6" fill="#0f1a2e" stroke="#f5b83d" stroke-width="1.4" />
        <text y="-48" text-anchor="middle" fill="#f5b83d">R$ 12,90</text>
      </g>
      <!-- p4 esmeralda -->
      <g transform="translate(905 168)">
        <use href="#pin" fill="#2ecc49" stroke="#0b1220" stroke-width="2" filter="url(#soft)" />
        <circle cy="-26" r="5" fill="#0b1220" />
        <rect x="-42" y="-66" width="84" height="26" rx="6" fill="#0f1a2e" stroke="#2ecc49" stroke-width="1.4" />
        <text y="-48" text-anchor="middle" fill="#2ecc49">R$ 6,29</text>
      </g>
      <!-- p5 cyan -->
      <g transform="translate(1014 244)">
        <use href="#pin" fill="#00c2d8" stroke="#0b1220" stroke-width="2" filter="url(#soft)" />
        <circle cy="-26" r="5" fill="#0b1220" />
        <rect x="-42" y="-66" width="84" height="26" rx="6" fill="#0f1a2e" stroke="#00c2d8" stroke-width="1.4" />
        <text y="-48" text-anchor="middle" fill="#35d6e8">R$ 3,79</text>
      </g>
      <!-- p6 esmeralda promo -->
      <g transform="translate(690 96)">
        <use href="#pin" fill="#2ecc49" stroke="#0b1220" stroke-width="2" filter="url(#soft)" />
        <circle cy="-26" r="5" fill="#0b1220" />
        <rect x="-48" y="-68" width="96" height="28" rx="6" fill="#14301c" stroke="#2ecc49" stroke-width="1.6" filter="url(#soft)" />
        <text y="-49" text-anchor="middle" fill="#8ff0a4">R$ 2,49</text>
      </g>
    </g>

    <!-- vinheta suave -->
    <rect x="12" y="12" width="1076" height="262" fill="none" stroke="#2ecc49" stroke-opacity="0.5" stroke-width="1.4" />
  </g>

  <!-- ============ título sobre o mapa ============ -->
  <g>
    <rect x="34" y="34" width="396" height="100" rx="10" fill="#0b1220" fill-opacity="0.72" />
    <text x="48" y="88" font-family="'JetBrains Mono','Fira Code',monospace" font-size="52" font-weight="bold" letter-spacing="1" fill="url(#titleg)" filter="url(#glow)">finmemory</text>
    <text x="50" y="116" font-family="'JetBrains Mono','Fira Code',monospace" font-size="14.5" fill="#c9d6e8">sua nf-e do gmail virada em mapa de preços</text>
  </g>

  <!-- ============ faixa rodapé ============ -->
  <line x1="34" y1="288" x2="1066" y2="288" stroke="#22345a" stroke-width="1" />
  <g font-family="'JetBrains Mono','Fira Code',monospace" font-size="12.5">
    <text x="34" y="308" fill="#5b7290">nf-e → openai → supabase · preço + unidade + geo</text>
    <text x="1066" y="308" text-anchor="end" fill="#2ecc49">11 redes · 3 crons · playwright · ttl 24h</text>
  </g>
</svg>
